name: xuchuan-operations
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xuchuan
      POSTGRES_USER: xuchuan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U xuchuan -d xuchuan"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://xuchuan:${POSTGRES_PASSWORD}@db:5432/xuchuan
      ARCHIVE_DIR: /data/archive
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the exact application origin}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?Set a Fernet key for mailbox credentials}
    depends_on:
      db: {condition: service_healthy}
    volumes: [archive_data:/data/archive]
  api:
    build: .
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --no-proxy-headers]
    restart: unless-stopped
    environment: *app_env
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    volumes: [archive_data:/data/archive]
  worker:
    build: .
    command: [python, -m, app.worker, --mail]
    restart: unless-stopped
    env_file: .env.mail
    environment: *app_env
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    volumes: [archive_data:/data/archive]
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
volumes:
  postgres_data:
  archive_data:
