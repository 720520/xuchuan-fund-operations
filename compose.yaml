name: xuchuan-operations
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xuchuan
      POSTGRES_USER: xuchuan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U xuchuan -d xuchuan"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default_logging
  migrate:
    build: .
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://xuchuan:${POSTGRES_PASSWORD}@db:5432/xuchuan
      ARCHIVE_DIR: /data/archive
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the exact application origin}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?Set a Fernet key for mailbox credentials}
      MAX_UPLOAD_MIB: ${MAX_UPLOAD_MIB:-25}
    depends_on:
      db: {condition: service_healthy}
    volumes: [archive_data:/data/archive]
    logging: *default_logging
  api:
    build: .
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --no-proxy-headers]
    restart: unless-stopped
    environment: *app_env
    depends_on:
      migrate: {condition: service_completed_successfully}
    init: true
    read_only: true
    tmpfs: [/tmp]
    volumes: [archive_data:/data/archive]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); assert r['status'] == 'ok'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    logging: *default_logging
  worker:
    build: .
    command: [python, -m, app.worker, --mail]
    restart: unless-stopped
    environment: *app_env
    depends_on:
      migrate: {condition: service_completed_successfully}
    init: true
    read_only: true
    tmpfs: [/tmp]
    volumes: [archive_data:/data/archive]
    logging: *default_logging
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *default_logging
volumes:
  postgres_data:
  archive_data:
