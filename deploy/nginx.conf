server {
    listen 80;
    server_name _;
    client_max_body_size 21m;
    client_body_timeout 30s;
    send_timeout 30s;
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_request_buffering on;
    }
}
