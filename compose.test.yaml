name: xuchuan-qa
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xuchuan_test
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa-isolated-local-only
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U qa -d xuchuan_test"]
      interval: 2s
      timeout: 3s
      retries: 20
