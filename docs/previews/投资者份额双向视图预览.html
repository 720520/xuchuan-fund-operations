<!doctype html>
<html lang="zh-CN">
<head>

  <style>

    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}

    .sidebar-foot{position:absolute;left:28px;right:28px;bottom:24px;padding-top:16px;border-top:1px solid #ddd9ce;color:var(--muted);font-size:9px;line-height:1.8}
    main{min-width:0}.topbar{height:56px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,253,249,.88);border-bottom:1px solid var(--line);color:var(--muted);font-size:10px}.topbar strong{color:#555a50}.preview-badge{padding:5px 9px;border-radius:999px;background:var(--rust-soft);color:#92583f;font-size:8px;font-weight:650;letter-spacing:.04em}
    .page{max-width:1530px;margin:auto;padding:25px 32px 34px}.heading{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}.heading h1{margin:0;font:30px Georgia,"Songti SC",serif;font-weight:500}.heading p{margin:8px 0 0;color:var(--muted);font-size:10px}.heading-actions{display:flex;gap:8px}.outline{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:10px}.primary{padding:8px 13px;border:0;border-radius:9px;background:var(--rust);color:white;font-size:10px;box-shadow:0 6px 16px rgba(168,97,71,.18)}

    .master{min-width:0;padding:16px 10px;background:#f3f1eb;border-right:1px solid var(--line)}.master-head{display:flex;align-items:center;justify-content:space-between;padding:0 7px 11px}.master-head strong{font-size:11px}.master-head span{color:var(--muted);font-size:8px}.entity-list{height:calc(100% - 30px);overflow:auto;scrollbar-width:thin}.entity{width:100%;margin-bottom:5px;padding:11px 12px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;cursor:pointer}.entity:hover{background:#faf8f3}.entity.active{border-color:#d8cbc0;background:var(--paper);box-shadow:0 5px 18px rgba(64,57,48,.06)}.entity-name{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:650}.entity-name i{width:7px;height:7px;border-radius:50%;background:#a7aa9f}.entity.active .entity-name i{background:var(--rust);box-shadow:0 0 0 4px var(--rust-soft)}.entity > small{display:block;margin:6px 0 8px 15px;color:var(--muted);font-size:8px}.entity-meta{display:flex;gap:11px;margin-left:15px;color:#686d63;font-size:8px}.entity-meta .attention{color:var(--amber)}

    .share-layout{min-height:0;display:grid;grid-template-columns:minmax(500px,1.2fr) minmax(330px,.8fr)}
    .holdings{min-width:0;overflow:auto;padding:16px 17px 24px;border-right:1px solid var(--line)}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-head div strong{display:block;font-size:11px}.section-head div span{display:block;margin-top:4px;color:var(--muted);font-size:8px}.filter{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:#64695e;font-size:8px}
    .holding-list{display:grid;gap:7px}.holding{width:100%;display:grid;grid-template-columns:minmax(180px,1.7fr) minmax(95px,.72fr) minmax(110px,.85fr) 78px 18px;align-items:center;gap:12px;padding:12px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);text-align:left;cursor:pointer}.holding:hover{border-color:#cfb9ad;background:#fffaf7}.holding.active{border-color:#bd8068;background:#fffaf6;box-shadow:0 0 0 2px rgba(168,97,71,.08)}.holding-product{min-width:0}.holding-product strong{display:block;overflow:hidden;font-size:10px;text-overflow:ellipsis;white-space:nowrap}.holding-product small{display:block;margin-top:5px;color:var(--muted);font-size:8px}.holding-number span,.holding-change span{display:block;color:var(--muted);font-size:7px}.holding-number strong{display:block;margin-top:4px;font:16px Georgia,serif}.holding-change strong{display:block;margin-top:4px;color:var(--olive);font-size:9px}.holding-change strong.negative{color:#93644f}.state{display:inline-flex;justify-self:start;padding:4px 7px;border-radius:999px;background:var(--olive-soft);color:#61705a;font-size:7px;white-space:nowrap}.state.warn{background:var(--amber-soft);color:#986b2c}.arrow{color:#aaa99f;font-size:16px}
    .history{margin-top:17px}.history-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.history-title strong{font-size:10px}.history-title span{color:var(--muted);font-size:8px}.history-row{display:grid;grid-template-columns:72px 54px minmax(170px,1fr) 90px 80px;gap:10px;padding:9px 10px;border-top:1px solid #eeeae1;font-size:8px}.history-row.header{padding-top:7px;border-top:0;background:#f7f5ef;color:var(--muted);border-radius:7px}.history-row .amount{font-weight:650}.history-row .source{color:var(--rust)}
    .evidence{min-width:0;overflow:auto;padding:17px;background:#faf8f3}.evidence-empty{height:100%;display:grid;place-items:center;color:var(--muted);font-size:9px}.evidence-card{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}.evidence-top{padding:16px;border-bottom:1px solid var(--line)}.evidence-top > span{color:var(--rust);font-size:7px;font-weight:700;letter-spacing:.12em}.evidence-top h3{margin:7px 0 5px;font:16px Georgia,"Songti SC",serif}.evidence-top p{margin:0;color:var(--muted);font-size:8px}.current-balance{display:flex;align-items:flex-end;justify-content:space-between;margin-top:15px;padding:12px;border-radius:9px;background:var(--paper-2)}.current-balance span{display:block;color:var(--muted);font-size:7px}.current-balance strong{display:block;margin-top:4px;font:22px Georgia,serif}.verified{padding:4px 7px;border-radius:999px;background:var(--olive-soft);color:var(--olive);font-size:7px}
    .source-chain{padding:15px 16px}.source-chain > strong{display:block;margin-bottom:12px;font-size:10px}.chain-item{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:9px;padding-bottom:14px}.chain-item:not(:last-child):before{content:"";position:absolute;left:11px;top:22px;bottom:0;width:1px;background:#ddd9cf}.chain-icon{z-index:1;display:grid;width:24px;height:24px;place-items:center;border:1px solid #d8d4ca;border-radius:50%;background:#f8f6f0;color:var(--olive);font-size:9px}.chain-copy strong{display:block;margin:1px 0 4px;font-size:9px}.chain-copy p{margin:0;color:var(--muted);font-size:8px;line-height:1.55}.chain-copy button{margin-top:6px;padding:0;border:0;background:transparent;color:var(--rust);font-size:8px;cursor:pointer}.reconcile{margin:0 16px 15px;padding:11px 12px;border-radius:9px;background:var(--olive-soft);color:#5f6b58;font-size:8px;line-height:1.6}.reconcile.warn{background:var(--amber-soft);color:#8d652d}.evidence-actions{display:flex;gap:7px;padding:0 16px 16px}.evidence-actions button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:8px}.evidence-actions button:first-child{border-color:#d2aa98;color:var(--rust)}
    .placeholder-tab{display:none;min-height:0;overflow:auto;padding:22px}.placeholder-tab.active{display:block}.placeholder-card{padding:26px;border:1px solid var(--line);border-radius:12px;background:#faf8f3}.placeholder-card h3{margin:0 0 8px;font:17px Georgia,serif}.placeholder-card p{max-width:660px;margin:0;color:var(--muted);font-size:9px;line-height:1.8}
    @media(max-width:1100px){.app{grid-template-columns:78px minmax(0,1fr)}.sidebar{padding:25px 12px}.brand-copy,.tenant,.nav-item span,.sidebar-foot{display:none}.brand{justify-content:center}.nav-item{text-align:center}.share-layout{grid-template-columns:minmax(450px,1.1fr) minmax(300px,.9fr)}.subject-side .metric:first-child{display:none}.page{padding:22px 20px}}
    @media(max-width:780px){.app{display:block}.sidebar{display:none}.page{padding:15px}.heading p,.quiet-note{display:none}.workbench{height:auto;display:block}.master{border-right:0;border-bottom:1px solid var(--line)}.entity-list{display:flex;height:auto;overflow:auto}.entity{min-width:210px}.subject{align-items:flex-start}.subject-side{display:none}.share-layout{display:block}.holdings{border-right:0}.evidence{border-top:1px solid var(--line)}.holding{grid-template-columns:minmax(150px,1fr) 90px 72px 16px}.holding-change{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">序</div><div class="brand-copy"><strong>序川</strong><small>FUND OPERATIONS</small></div></div>
      <div class="tenant"><span>当前管理人</span><strong>吉余私募基金管理有限公司</strong><small>运营工作空间</small></div>
      <nav><button class="nav-item"><i>▦</i><span>工作概览</span></button><button class="nav-item"><i>▱</i><span>产品台账</span></button><button class="nav-item"><i>⌁</i><span>净值与估值</span></button><button class="nav-item"><i>✉</i><span>邮件中心</span></button><button class="nav-item active"><i>▣</i><span>资料中心</span></button><button class="nav-item"><i>!</i><span>异常中心</span></button><button class="nav-item"><i>☷</i><span>业务留痕</span></button></nav>
      <div class="sidebar-foot">● 业务数据 15 秒刷新<br/>admin · 运营工作空间</div>
    </aside>
    <main>
      <header class="topbar"><span>工作空间　›　资料中心　›　<strong>投资者份额</strong></span><span class="preview-badge">交互预览 · 演示数据</span></header>
      <div class="page">
        <div class="heading"><div><h1>投资者份额</h1><p>从投资者或产品出发，查看当前份额、变动过程和邮件依据。</p></div><div class="heading-actions"><button class="outline">导出当前视图</button><button class="primary">＋ 整理份额邮件</button></div></div>
        <div class="toolbar">
          <div class="direction"><button class="active" data-perspective="investor">按投资者</button><button data-perspective="product">按产品</button></div>
          <label class="search"><span>⌕</span><input id="search" placeholder="搜索投资者名称" /></label>
          <button class="outline">全部状态　⌄</button>
          <span class="quiet-note"><b>● 邮件自动入账</b> · 仅异常需要处理</span>
        </div>
        <section class="workbench">
          <aside class="master"><div class="master-head"><strong id="master-title">投资者</strong><span id="master-count"></span></div><div class="entity-list" id="entity-list"></div></aside>
          <div class="content">
            <header class="subject" id="subject"></header>
            <div class="tabs"><button class="active" data-tab="holding">当前份额</button><button data-tab="change">全部变动 <b>12</b></button><button data-tab="snapshot">托管快照</button><button data-tab="material">来源材料</button></div>
            <div class="share-layout" id="holding-view"><section class="holdings"><div class="section-head"><div><strong id="holding-title">当前持有产品</strong><span>以已接收邮件中的最新有效记录为准</span></div><button class="filter">数据日期：最新　⌄</button></div><div class="holding-list" id="holding-list"></div><div class="history" id="history"></div></section><aside class="evidence" id="evidence"></aside></div>
            <div class="placeholder-tab" id="placeholder-view"><div class="placeholder-card"><h3 id="placeholder-title"></h3><p id="placeholder-copy"></p></div></div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script>
    const investors=[
      {id:'i1',name:'程宇',sub:'个人投资者 · 普通投资者',relations:3,total:'2,550,000.00',asof:'2026-09-14',attention:0},
      {id:'i2',name:'中信期货有限公司湘南分公司',sub:'机构投资者 · 专业投资者',relations:2,total:'8,600,000.00',asof:'2026-09-14',attention:1},
      {id:'i3',name:'张建勋',sub:'个人投资者 · 普通投资者',relations:4,total:'3,180,500.00',asof:'2026-09-13',attention:0},

      {id:'i5',name:'管理人跟投',sub:'机构投资者 · 专业投资者',relations:5,total:'1,750,000.00',asof:'2026-09-14',attention:1}
    ];
    const products=[
      {id:'p1',name:'吉余天乙伍号私募证券投资基金',sub:'SAWK26 · 日开',relations:18,total:'28,650,000.00',asof:'2026-09-14',attention:0},

      {id:'p4',name:'吉余美提斯2号私募证券投资基金',sub:'MTS02 · 季开',relations:7,total:'8,380,500.00',asof:'2026-09-12',attention:0}
    ];
    const investorHoldings={
      i1:[
        {id:'p1',name:products[0].name,sub:'SAWK26 · 总份额',units:'1,250,000.00',change:'+250,000.00',event:'申购确认',date:'2026-09-14',state:'已同步',warn:false,mail:'托管投资者份额确认_程宇_20260914.xlsx',subject:'吉余天乙伍号投资者份额确认 20260914',received:'2026-09-15 09:18',snapshot:'1,250,000.00'},
        {id:'p2',name:products[1].name,sub:'SBQG82 · 总份额',units:'800,000.00',change:'-50,000.00',event:'赎回确认',date:'2026-09-12',state:'已同步',warn:false,mail:'SBQG82_赎回确认单_20260912.pdf',subject:'【赎回确认】程宇-SBQG82-20260912',received:'2026-09-13 10:06',snapshot:'800,000.00'},
        {id:'p3',name:products[2].name,sub:'JYL01 · 总份额',units:'500,000.00',change:'+12,460.25',event:'红利再投资',date:'2026-09-10',state:'已同步',warn:false,mail:'红利再投资确认_20260910.pdf',subject:'吉余杰伦壹号红利再投资确认',received:'2026-09-11 08:42',snapshot:'500,000.00'}
      ],

    const productHoldings={

        {id:'i4',name:'上海远山企业管理有限公司',sub:'机构 · 专业投资者',units:'7,000,000.00',change:'+1,000,000.00',event:'追加申购',date:'2026-09-10',state:'已同步',warn:false,mail:'机构投资者份额确认.xlsx',subject:'吉余天乙伍号投资者份额表',received:'2026-09-11 11:20',snapshot:'7,000,000.00'}
      ],
      p2:[{id:'i2',name:'中信期货有限公司湘南分公司',sub:'机构 · 专业投资者',units:'8,600,000.00',change:'+600,000.00',event:'追加申购',date:'2026-09-14',state:'快照差异',warn:true,mail:'机构份额确认表_20260914.xlsx',subject:'SBQG82投资者份额表',received:'2026-09-15 10:21',snapshot:'8,590,000.00'}]

    const fallback=(entity,perspective)=>[{id:'demo',name:perspective==='investor'?products[3].name:'管理人跟投',sub:perspective==='investor'?'MTS02 · 总份额':'机构 · 专业投资者',units:entity.total,change:'+0.00',event:'托管快照',date:entity.asof,state:entity.attention?'待处理':'已同步',warn:Boolean(entity.attention),mail:'托管投资者份额表_'+entity.asof.replaceAll('-','')+'.xlsx',subject:'投资者份额信息 '+entity.asof,received:'2026-09-15 09:00',snapshot:entity.total}];

    const entities=()=>state.perspective==='investor'?investors:products;
    const current=()=>entities().find(x=>x.id===state.selected)||entities()[0];
    const holdings=()=>{const e=current();const map=state.perspective==='investor'?investorHoldings:productHoldings;return map[e.id]||fallback(e,state.perspective)};
    function renderMaster(){const q=state.query.toLowerCase();const list=entities().filter(x=>(x.name+x.sub).toLowerCase().includes(q));if(!list.some(x=>x.id===state.selected)){state.selected=(list[0]||entities()[0]).id;state.holding=''}$('master-title').textContent=state.perspective==='investor'?'投资者':'产品';$('master-count').textContent=list.length+' 个主体';$('entity-list').innerHTML=list.map(x=>`<button class="entity ${x.id===state.selected?'active':''}" data-id="${x.id}"><span class="entity-name"><i></i>${x.name}</span><small>${x.sub}</small><span class="entity-meta"><span>${x.relations} 个关联</span><span>${x.asof}</span>${x.attention?`<span class="attention">${x.attention} 异常</span>`:'<span>正常</span>'}</span></button>`).join('');$('entity-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.selected=b.dataset.id;state.holding='';render()})}
    function renderSubject(){const e=current();$('subject').innerHTML=`<div><div class="subject-label">当前${state.perspective==='investor'?'投资者':'产品'}</div><h2>${e.name}</h2><p>${e.sub} · 最新份额数据 ${e.asof} · 来源邮件自动归档</p></div><div class="subject-side"><div class="metric"><span>关联${state.perspective==='investor'?'产品':'投资者'}</span><strong>${e.relations}</strong></div><div class="metric"><span>汇总份额</span><strong>${e.total}</strong></div><div class="metric good"><span>数据状态</span><strong>${e.attention?'1 项差异':'正常'}</strong></div></div>`}
    function renderHoldings(){const list=holdings();if(!list.some(x=>x.id===state.holding))state.holding=list[0]?.id||'';$('holding-title').textContent=state.perspective==='investor'?'当前持有产品':'当前投资者份额';$('holding-list').innerHTML=list.map(x=>`<button class="holding ${x.id===state.holding?'active':''}" data-id="${x.id}"><span class="holding-product"><strong>${x.name}</strong><small>${x.sub} · 数据日 ${x.date}</small></span><span class="holding-number"><span>当前份额</span><strong>${x.units}</strong></span><span class="holding-change"><span>最近变动</span><strong class="${x.change.startsWith('-')?'negative':''}">${x.event} ${x.change}</strong></span><span class="state ${x.warn?'warn':''}">${x.state}</span><span class="arrow">›</span></button>`).join('');$('holding-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.holding=b.dataset.id;renderHoldings()});renderHistory(list);renderEvidence(list.find(x=>x.id===state.holding))}
    function renderHistory(list){const active=list.find(x=>x.id===state.holding)||list[0];$('history').innerHTML=`<div class="history-title"><strong>最近变动</strong><span>当前主体的最新 3 条记录</span></div><div class="history-row header"><span>业务日期</span><span>类型</span><span>${state.perspective==='investor'?'产品':'投资者'}</span><span>份额变动</span><span>来源</span></div>${[active,...list.filter(x=>x!==active)].slice(0,3).map(x=>`<div class="history-row"><span>${x.date}</span><span>${x.event.replace('确认','')}</span><span>${x.name}</span><span class="amount">${x.change}</span><span class="source">原始邮件</span></div>`).join('')}`}
    function renderEvidence(x){if(!x){$('evidence').innerHTML='<div class="evidence-empty">选择一条份额记录查看数据依据</div>';return}const same=x.snapshot===x.units;$('evidence').innerHTML=`<div class="evidence-card"><div class="evidence-top"><span>份额详情 · 数据依据</span><h3>${x.name}</h3><p>${x.sub} · 数据日 ${x.date}</p><div class="current-balance"><div><span>当前有效份额</span><strong>${x.units}</strong></div><b class="verified">${same?'已与托管快照一致':'存在差异'}</b></div></div><div class="source-chain"><strong>证据链</strong><div class="chain-item"><i class="chain-icon">✉</i><div class="chain-copy"><strong>${x.subject}</strong><p>公司邮箱-日常运营 · ${x.received}</p><button>查看原始邮件 →</button></div></div><div class="chain-item"><i class="chain-icon">▤</i><div class="chain-copy"><strong>${x.mail}</strong><p>邮件附件 · 已校验原件指纹 · 已归档</p><button>下载附件 →</button></div></div><div class="chain-item"><i class="chain-icon">✓</i><div class="chain-copy"><strong>${x.event} ${x.change}</strong><p>模板自动识别 · 已写入份额台账 · 原记录不可直接修改</p></div></div></div><div class="reconcile ${same?'':'warn'}">托管快照 ${x.snapshot}，台账份额 ${x.units}。${same?'两者一致，无需人工核对。':'相差 10,000.00，已进入异常中心等待处理。'}</div><div class="evidence-actions"><button>查看完整变动</button><button>查看关联资料</button></div></div>`}
    function renderTab(){const holding=state.tab==='holding';$('holding-view').style.display=holding?'grid':'none';$('placeholder-view').classList.toggle('active',!holding);if(!holding){const copy={change:['全部变动','按时间连续展示申购、赎回、分红和更正记录，并保留每条记录对应的原始邮件。可按产品、业务类型和日期筛选。'],snapshot:['托管快照','展示托管发送的各期持仓快照。快照只用于核对当前余额，不重复计算为份额增减。'],material:['来源材料','集中查看份额记录关联的邮件正文、附件、确认单和持仓表；点击材料可以反查其生成的份额记录。']}[state.tab];$('placeholder-title').textContent=copy[0];$('placeholder-copy').textContent=copy[1]}}
    function render(){renderMaster();renderSubject();renderHoldings();renderTab()}
    document.querySelectorAll('[data-perspective]').forEach(b=>b.onclick=()=>{state.perspective=b.dataset.perspective;state.selected=entities()[0].id;state.holding='';state.query='';$('search').value='';$('search').placeholder=state.perspective==='investor'?'搜索投资者名称':'搜索产品名称或代码';document.querySelectorAll('[data-perspective]').forEach(x=>x.classList.toggle('active',x===b));render()});
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderTab()});
    $('search').oninput=e=>{state.query=e.target.value;render()};render();
  </script>
</body>
</html>
