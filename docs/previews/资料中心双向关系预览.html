<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>资料中心双向关系预览</title>
  <style>
    :root {
      --canvas:#f2f0ea; --paper:#fffdf8; --paper-2:#f8f6f0; --ink:#292d28;
      --muted:#7e8379; --line:#e3dfd5; --rust:#a85f45; --rust-soft:#f2e4dc;
      --olive:#71806a; --olive-soft:#e8ede3; --amber:#b9863f; --amber-soft:#f7edd9;
      --shadow:0 16px 40px rgba(52,45,37,.09); --radius:14px;
    }
    * { box-sizing:border-box }
    html,body { margin:0; min-height:100%; background:var(--canvas); color:var(--ink); font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif }
    button,input { font:inherit }
    button { color:inherit }
    .app { min-height:100vh; display:grid; grid-template-columns:224px minmax(0,1fr) }
    .sidebar { position:sticky; top:0; height:100vh; padding:30px 20px 22px; background:#eeece5; border-right:1px solid var(--line); display:flex; flex-direction:column }
    .brand { display:flex; align-items:center; gap:12px; margin:0 10px 36px }
    .brand-mark { width:38px; height:38px; border:1px solid #ceb9aa; border-radius:12px; display:grid; place-items:center; color:var(--rust); font-weight:800 }
    .brand strong { font-family:Georgia,"Songti SC",serif; font-size:24px; letter-spacing:.18em }
    .brand small { display:block; margin-top:2px; font-size:9px; letter-spacing:.27em; color:var(--muted) }
    .tenant { margin:0 8px 24px; padding:13px 12px; border:1px solid var(--line); border-radius:12px; background:rgba(255,253,248,.6) }
    .tenant span { display:block; color:var(--muted); font-size:11px; margin-bottom:5px }
    .tenant strong { font-size:13px }
    .nav { display:grid; gap:6px }
    .nav div { padding:11px 13px; border-radius:10px; color:#646960; font-size:14px }
    .nav .active { color:var(--rust); background:#eadbd1; font-weight:650 }
    .sidebar-foot { margin-top:auto; padding:16px 10px 0; border-top:1px solid var(--line); color:var(--muted); font-size:12px }
    main { min-width:0 }
    .topbar { height:64px; padding:0 32px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,253,248,.88); border-bottom:1px solid var(--line) }
    .crumb { color:var(--muted); font-size:13px }
    .date { font-size:13px; color:#555b52 }
    .page { padding:28px 32px 42px; max-width:1660px; margin:auto }
    .heading { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:22px }
    h1 { margin:0 0 8px; font-family:Georgia,"Songti SC",serif; font-size:28px; font-weight:650 }
    .heading p { margin:0; color:var(--muted); font-size:13px }
    .upload { border:0; border-radius:10px; background:var(--rust); color:white; padding:10px 18px; box-shadow:0 5px 12px rgba(168,95,69,.22); cursor:pointer }
    .demo-tag { display:inline-flex; align-items:center; margin-left:10px; padding:3px 8px; border-radius:999px; background:var(--amber-soft); color:#895f25; font:600 10px/1.4 sans-serif; vertical-align:middle }
    .view-tabs { display:flex; gap:26px; height:43px; border-bottom:1px solid var(--line); margin-bottom:16px }
    .view-tabs button { position:relative; border:0; background:none; padding:0 2px 13px; color:var(--muted); cursor:pointer }
    .view-tabs button.active { color:var(--ink); font-weight:650 }
    .view-tabs button.active:after { content:""; position:absolute; height:2px; left:0; right:0; bottom:-1px; background:var(--rust) }
    .toolbar { min-height:58px; padding:10px 12px; display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line); border-radius:12px; box-shadow:0 4px 14px rgba(50,46,39,.035); margin-bottom:14px }
    .direction { display:flex; padding:3px; background:#eeece6; border-radius:9px }
    .direction button { min-width:92px; border:0; border-radius:7px; padding:7px 12px; background:transparent; color:var(--muted); cursor:pointer }
    .direction button.active { background:var(--paper); color:var(--rust); box-shadow:0 1px 5px rgba(55,48,40,.12); font-weight:650 }
    .search { flex:1; min-width:180px; position:relative }
    .search:before { content:"⌕"; position:absolute; left:13px; top:6px; color:#96998f; font-size:20px }
    .search input { width:100%; height:36px; padding:0 14px 0 38px; border:1px solid var(--line); border-radius:9px; background:var(--paper-2); outline:none }
    .search input:focus { border-color:#c48b75; box-shadow:0 0 0 3px rgba(168,95,69,.09) }
    .filter { border:1px solid var(--line); background:var(--paper); border-radius:9px; padding:8px 11px; color:#5f655b; cursor:pointer }
    .workspace { min-height:650px; display:grid; grid-template-columns:280px minmax(0,1fr); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--paper); box-shadow:var(--shadow) }
    .master { min-width:0; background:#f5f3ed; border-right:1px solid var(--line); padding:18px 12px }
    .master-head { display:flex; justify-content:space-between; align-items:center; padding:0 6px 12px }
    .master-head strong { font-size:14px }
    .master-head small { color:var(--muted) }
    .entity-list { display:grid; gap:6px }
    .entity { width:100%; text-align:left; border:1px solid transparent; background:transparent; border-radius:10px; padding:12px; cursor:pointer }
    .entity:hover { background:rgba(255,253,248,.65) }
    .entity.active { background:var(--paper); border-color:#d9cfc4; box-shadow:0 5px 14px rgba(50,46,39,.07) }
    .entity-top { display:flex; gap:8px; align-items:center }
    .entity-dot { width:8px; height:8px; border-radius:50%; background:#a5aa9f; flex:none }
    .entity.active .entity-dot { background:var(--rust); box-shadow:0 0 0 4px var(--rust-soft) }
    .entity-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:650; font-size:13px }
    .entity-code { margin:5px 0 8px 16px; color:var(--muted); font-size:11px }
    .entity-meta { display:flex; gap:12px; margin-left:16px; color:#696e65; font-size:11px }
    .entity-meta .warn { color:#a86d26 }
    .content { min-width:0; padding:24px }
    .subject { display:flex; justify-content:space-between; gap:20px; padding-bottom:20px; border-bottom:1px solid var(--line) }
    .eyebrow { color:var(--rust); font-size:11px; font-weight:700; letter-spacing:.14em; margin-bottom:7px }
    .subject h2 { margin:0 0 8px; font-family:Georgia,"Songti SC",serif; font-size:23px }
    .subject p { margin:0; color:var(--muted); font-size:12px }
    .stats { display:flex; gap:8px; align-self:center }
    .stat { min-width:82px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--paper-2) }
    .stat span { display:block; color:var(--muted); font-size:10px; margin-bottom:3px }
    .stat strong { font-size:18px; font-family:Georgia,serif }
    .stat.warn strong { color:#a86d26 }
    .relations { padding:20px 0 18px }
    .section-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px }
    .section-title strong { font-size:14px }
    .section-title small { color:var(--muted) }
    .relation-list { display:flex; gap:9px; overflow:auto; padding:2px 2px 8px }
    .relation { flex:0 0 178px; border:1px solid var(--line); border-radius:10px; background:var(--paper); padding:11px 12px; cursor:pointer; text-align:left }
    .relation:hover { border-color:#cdb7a8 }
    .relation.active { border-color:var(--rust); background:#fff9f5; box-shadow:0 0 0 2px var(--rust-soft) }
    .relation strong { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:12px; margin-bottom:6px }
    .relation small { color:var(--muted); font-size:10px }
    .relation .rel-count { display:flex; justify-content:space-between; margin-top:10px; color:#5e645a; font-size:11px }
    .scope { display:flex; align-items:center; gap:7px; min-height:42px; padding:8px 10px; margin:0 0 12px; background:var(--olive-soft); border-radius:9px; color:#596454; font-size:12px; flex-wrap:wrap }
    .scope .chip { border:1px solid #cfd8c9; background:#f8faf6; border-radius:999px; padding:4px 9px; font-weight:650 }
    .scope .arrow { color:#9da695 }
    .scope .clear { margin-left:auto; border:0; color:#66715f; background:transparent; cursor:pointer }
    .table-wrap { border:1px solid var(--line); border-radius:10px; overflow:hidden }
    table { width:100%; border-collapse:collapse; table-layout:fixed }
    th { height:40px; padding:0 12px; background:#f5f3ee; color:#777d73; font-size:11px; font-weight:600; text-align:left }
    td { padding:12px; border-top:1px solid #ebe7de; vertical-align:top; font-size:12px }
    tbody tr { cursor:pointer }
    tbody tr:hover { background:#fffaf7 }
    .doc-title { display:block; font-weight:650; overflow:hidden; white-space:nowrap; text-overflow:ellipsis }
    .doc-file { display:block; margin-top:4px; color:var(--muted); font-size:10px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis }
    .badge { display:inline-flex; align-items:center; border-radius:999px; padding:4px 8px; font-size:10px; white-space:nowrap }
    .badge.done { color:#587052; background:var(--olive-soft) }
    .badge.todo { color:#986b2c; background:var(--amber-soft) }
    .badge.category { color:#765848; background:#efe8e1 }
    .more { color:var(--rust); font-weight:650 }
    .table-foot { display:flex; justify-content:space-between; padding:12px 3px 0; color:var(--muted); font-size:11px }
    .empty { padding:46px; text-align:center; color:var(--muted) }
    @media (max-width:1100px) {
      .app { grid-template-columns:76px minmax(0,1fr) }
      .sidebar { padding:25px 12px }
      .brand { margin:0 auto 30px }.brand-text,.tenant,.nav div span,.sidebar-foot { display:none }
      .nav div { text-align:center }.page { padding:24px 20px }.workspace { grid-template-columns:238px minmax(0,1fr) }
      .subject { display:block }.stats { margin-top:14px }.hide-medium { display:none }
    }
    @media (max-width:760px) {
      .app { display:block }.sidebar { display:none }.topbar { padding:0 16px }.page { padding:20px 14px }
      .heading { align-items:center }.heading p { display:none }.toolbar { flex-wrap:wrap }.direction { width:100% }.direction button { flex:1 }
      .filter { display:none }.workspace { display:block }.master { border-right:0; border-bottom:1px solid var(--line); padding:12px }
      .entity-list { display:flex; overflow:auto }.entity { min-width:210px }.content { padding:18px 14px }.stats { overflow:auto }
      .stat { min-width:78px }.hide-small { display:none } th,td { padding:10px 8px }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">序</div><div class="brand-text"><strong>序川</strong><small>FUND OPERATIONS</small></div></div>
      <div class="tenant"><span>当前管理人</span><strong>示例基金管理有限公司</strong></div>
      <nav class="nav" aria-label="主导航">
        <div>▦　<span>工作概览</span></div><div>▱　<span>产品台账</span></div><div>⌁　<span>净值与估值</span></div>
        <div>✉　<span>邮件中心</span></div><div class="active">▣　<span>资料中心</span></div><div>!　<span>异常中心</span></div>
        <div>☷　<span>业务留痕</span></div><div>⚙　<span>组织与权限</span></div>
      </nav>
      <div class="sidebar-foot">● 业务数据 15 秒刷新<br><br>admin · 运营工作空间</div>
    </aside>
    <main>
      <header class="topbar"><span class="crumb">工作空间　›　资料中心</span><span class="date">9月11日 星期五　↻</span></header>
      <div class="page">
        <div class="heading">
          <div><h1>资料中心 <span class="demo-tag">交互预览 · 演示数据</span></h1><p>从产品或投资者出发，查看双方关系及其共同资料。</p></div>
          <button class="upload">＋ 上传资料</button>
        </div>
        <div class="view-tabs">
          <button class="active">关系工作台</button><button>全部资料</button><button>待整理 <b style="color:#a86d26">8</b></button>
        </div>
        <div class="toolbar">
          <div class="direction" role="tablist">
            <button id="by-product" class="active" data-view="product">按产品</button>
            <button id="by-investor" data-view="investor">按投资者</button>
          </div>
          <label class="search"><input id="search" type="search" placeholder="搜索产品" /></label>
          <button class="filter">仅看有待办　⌄</button><button class="filter">更多筛选　⌄</button>
        </div>
        <div class="workspace">
          <aside class="master">
            <div class="master-head"><strong id="master-title">产品</strong><small id="master-count"></small></div>
            <div id="entity-list" class="entity-list"></div>
          </aside>
          <section class="content">
            <div id="subject" class="subject"></div>
            <section class="relations">
              <div class="section-title"><strong id="relation-title">关联投资者</strong><small>选择后只看双方共同资料</small></div>
              <div id="relation-list" class="relation-list"></div>
            </section>
            <div id="scope" class="scope"></div>
            <div class="table-wrap">
              <table>
                <thead><tr><th style="width:13%">类别</th><th style="width:32%">资料</th><th class="hide-small" style="width:17%">关联</th><th class="hide-medium" style="width:12%">业务日期</th><th class="hide-medium" style="width:10%">来源</th><th style="width:10%">状态</th><th style="width:6%"></th></tr></thead>
                <tbody id="doc-list"></tbody>
              </table>
            </div>
            <div id="table-foot" class="table-foot"></div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script>
    const data = {
      product: [
        {id:'p1', name:'吉余示例一号私募证券投资基金', code:'JY-S001', rel:12, docs:36, todo:3,
          related:[{id:'i1',name:'示例投资者甲',type:'个人投资者',docs:6,todo:1},{id:'i2',name:'景辰资产管理计划',type:'资管计划',docs:5,todo:0},{id:'i3',name:'示例投资者乙',type:'个人投资者',docs:4,todo:1},{id:'i4',name:'管理人跟投',type:'管理人跟投',docs:3,todo:0}]},
        {id:'p2', name:'吉余示例二号私募证券投资基金', code:'JY-S002', rel:8, docs:24, todo:1,
          related:[{id:'i1',name:'示例投资者甲',type:'个人投资者',docs:4,todo:0},{id:'i5',name:'远山企业管理有限公司',type:'机构投资者',docs:7,todo:1},{id:'i4',name:'管理人跟投',type:'管理人跟投',docs:3,todo:0}]},
        {id:'p3', name:'吉余稳健三号私募证券投资基金', code:'JY-W003', rel:17, docs:41, todo:4,
          related:[{id:'i2',name:'景辰资产管理计划',type:'资管计划',docs:5,todo:1},{id:'i3',name:'示例投资者乙',type:'个人投资者',docs:4,todo:0},{id:'i5',name:'远山企业管理有限公司',type:'机构投资者',docs:6,todo:1}]},
        {id:'p4', name:'吉余量化精选私募证券投资基金', code:'JY-Q004', rel:9, docs:29, todo:0,
          related:[{id:'i6',name:'示例投资者丙',type:'个人投资者',docs:3,todo:0},{id:'i4',name:'管理人跟投',type:'管理人跟投',docs:2,todo:0}]}
      ],
      investor: [
        {id:'i1', name:'示例投资者甲', code:'个人投资者 · 已核对', rel:2, docs:10, todo:1,
          related:[{id:'p1',name:'吉余示例一号私募证券投资基金',type:'JY-S001',docs:6,todo:1},{id:'p2',name:'吉余示例二号私募证券投资基金',type:'JY-S002',docs:4,todo:0}]},
        {id:'i2', name:'景辰资产管理计划', code:'资管计划 · 已核对', rel:2, docs:10, todo:1,
          related:[{id:'p1',name:'吉余示例一号私募证券投资基金',type:'JY-S001',docs:5,todo:0},{id:'p3',name:'吉余稳健三号私募证券投资基金',type:'JY-W003',docs:5,todo:1}]},
        {id:'i3', name:'示例投资者乙', code:'个人投资者 · 待核对', rel:2, docs:8, todo:1,
          related:[{id:'p1',name:'吉余示例一号私募证券投资基金',type:'JY-S001',docs:4,todo:1},{id:'p3',name:'吉余稳健三号私募证券投资基金',type:'JY-W003',docs:4,todo:0}]},
        {id:'i4', name:'管理人跟投', code:'机构投资者 · 已核对', rel:3, docs:8, todo:0,
          related:[{id:'p1',name:'吉余示例一号私募证券投资基金',type:'JY-S001',docs:3,todo:0},{id:'p2',name:'吉余示例二号私募证券投资基金',type:'JY-S002',docs:3,todo:0},{id:'p4',name:'吉余量化精选私募证券投资基金',type:'JY-Q004',docs:2,todo:0}]},
        {id:'i5', name:'远山企业管理有限公司', code:'机构投资者 · 已核对', rel:2, docs:13, todo:2,
          related:[{id:'p2',name:'吉余示例二号私募证券投资基金',type:'JY-S002',docs:7,todo:1},{id:'p3',name:'吉余稳健三号私募证券投资基金',type:'JY-W003',docs:6,todo:1}]}
      ]
    };
    const templates = [
      ['合同及认申购','认申购材料（签署版）','认申购材料_签署版.pdf','2026-09-08','人工上传','已整理'],
      ['投资者准入','合格投资者证明材料','资产证明_202609.pdf','2026-09-06','历史导入','待核对'],
      ['运营凭证','申购确认单','托管申购确认单_0905.pdf','2026-09-05','邮件附件','已整理'],
      ['投资者准入','风险测评及适当性匹配','风险测评问卷.pdf','2026-09-02','人工上传','已整理'],
      ['合同及认申购','基金合同签署页','基金合同_签署页.pdf','2026-08-28','历史导入','待整理'],
      ['运营凭证','赎回确认单','赎回确认_20260825.pdf','2026-08-25','邮件附件','已整理']
    ];
    let state={view:'product',selected:'p1',related:null,query:''};
    const el=id=>document.getElementById(id);
    const current=()=>data[state.view].find(x=>x.id===state.selected) || data[state.view][0];
    function render(){
      const list=data[state.view].filter(x=>x.name.toLowerCase().includes(state.query.toLowerCase())||x.code.toLowerCase().includes(state.query.toLowerCase()));
      if(!list.some(x=>x.id===state.selected)){ state.selected=(list[0]||data[state.view][0]).id; state.related=null; }
      const item=current();
      el('master-title').textContent=state.view==='product'?'产品':'投资者'; el('master-count').textContent=`${list.length} 个主体`;
      el('search').placeholder=state.view==='product'?'搜索产品名称或代码':'搜索投资者名称或类型';
      el('entity-list').innerHTML=list.map(x=>`<button class="entity ${x.id===item.id?'active':''}" data-id="${x.id}"><div class="entity-top"><i class="entity-dot"></i><span class="entity-name">${x.name}</span></div><div class="entity-code">${x.code}</div><div class="entity-meta"><span>${x.rel} 个关联</span><span>${x.docs} 份资料</span><span class="${x.todo?'warn':''}">${x.todo} 待核对</span></div></button>`).join('');
      el('entity-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.selected=b.dataset.id;state.related=null;render()});
      const noun=state.view==='product'?'产品':'投资者', other=state.view==='product'?'投资者':'产品';
      el('subject').innerHTML=`<div><div class="eyebrow">当前${noun}</div><h2>${item.name}</h2><p>${item.code}　·　关系与资料仅作运营归档和核对</p></div><div class="stats"><div class="stat"><span>关联${other}</span><strong>${item.rel}</strong></div><div class="stat"><span>资料</span><strong>${item.docs}</strong></div><div class="stat warn"><span>待核对</span><strong>${item.todo}</strong></div></div>`;
      el('relation-title').textContent=`关联${other}`;
      el('relation-list').innerHTML=item.related.map(r=>`<button class="relation ${state.related===r.id?'active':''}" data-id="${r.id}"><strong>${r.name}</strong><small>${r.type}</small><div class="rel-count"><span>${r.docs} 份资料</span><span>${r.todo?'待核对 '+r.todo:'已核对'}</span></div></button>`).join('');
      el('relation-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.related=state.related===b.dataset.id?null:b.dataset.id;render()});
      const rel=item.related.find(r=>r.id===state.related);
      el('scope').innerHTML=`<span>当前范围</span><span class="chip">${item.name}</span>${rel?`<span class="arrow">→</span><span class="chip">${rel.name}</span><strong>共同资料 ${rel.docs}</strong><button class="clear" id="clear">清除关联 ×</button>`:`<strong>全部资料 ${item.docs}</strong>`}`;
      if(rel) el('clear').onclick=()=>{state.related=null;render()};
      const count=rel?Math.min(rel.docs,templates.length):Math.min(item.docs,templates.length);
      const rows=templates.slice(0,count);
      el('doc-list').innerHTML=rows.length?rows.map((d,i)=>`<tr><td><span class="badge category">${d[0]}</span></td><td><span class="doc-title">${d[1]}</span><span class="doc-file">${d[2]}</span></td><td class="hide-small">${rel?rel.name:item.related[i%item.related.length].name}</td><td class="hide-medium">${d[3]}</td><td class="hide-medium">${d[4]}</td><td><span class="badge ${d[5]==='已整理'?'done':'todo'}">${d[5]}</span></td><td class="more">查看</td></tr>`).join(''):`<tr><td colspan="7" class="empty">当前范围内暂无资料</td></tr>`;
      el('table-foot').innerHTML=`<span>当前展示 ${rows.length} 条演示记录</span><span>${rel?'已限定为双方共同资料':'选择关联对象可进一步缩小范围'}　　‹　1　›</span>`;
    }
    document.querySelectorAll('.direction button').forEach(b=>b.onclick=()=>{
      state.view=b.dataset.view; state.selected=data[state.view][0].id; state.related=null; state.query=''; el('search').value='';
      document.querySelectorAll('.direction button').forEach(x=>x.classList.toggle('active',x===b)); render();
    });
    el('search').oninput=e=>{state.query=e.target.value;render()};
    render();
  </script>
</body>
</html>
