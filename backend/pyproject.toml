[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xuchuan-operations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1.5,<4", "xlrd>=2.0.1,<3", "pypdf>=6,<7",
  "IMAPClient>=3,<4", "argon2-cffi>=23.1,<26", "cryptography>=50,<51",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
